<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Selkie{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            background: #171614;
            background-image: radial-gradient(
                circle at 1px 1px,
                #353129 1px,
                transparent 0
            );
            background-size: 24px 24px;

            font-family: "Trebuchet MS", sans-serif;
            color: #eee7d8;
        }

        .retro-card {
            background: #211f1b;
            border: 2px solid #4b463c;
            box-shadow: 5px 5px 0 #080808;
        }

        .retro-btn {
            background: #f4c842;
            color: #201f1b;
            border: 2px solid #c9bfa9;
            box-shadow: 3px 3px 0 #080808;
            transition: .12s;
        }

        .retro-btn:hover {
            background: #ffd95a;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #080808;
        }

        .secondary-btn {
            background: #24221e;
            color: #eee7d8;
            border: 2px solid #4b463c;
            box-shadow: 3px 3px 0 #080808;
            transition: .12s;
        }

        .secondary-btn:hover {
            background: #2b2822;
            border-color: #665e4f;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #080808;
        }

        .info-row {
            background: #24221e;
            border: 2px solid #3d3932;
        }

        .muted {
            color: #9d988d;
        }

        .mono {
            font-family: monospace;
        }

        .logo-box {
            background: #f4c842;
            border: 2px solid #c9bfa9;
            box-shadow: 5px 5px 0 #090909;
        }

        .sidebar {
            background: #1c1a17;
            border-right: 2px solid #3d3932;
        }

        .sidebar-nav {
            border-top: 1px solid #3d3932;
            border-bottom: 1px solid #3d3932;
        }

        .sidebar-link {
            color: #aaa398;
            border: 1px solid transparent;
            transition: .12s;
        }

        .sidebar-link:hover {
            background: #25221e;
            color: #eee7d8;
            border-color: #3d3932;
        }

        .sidebar-link.active {
            background: #f4c842;
            color: #201f1b;
            border-color: #c9bfa9;
            box-shadow: 3px 3px 0 #080808;
        }
    </style>

    {% block head %}{% endblock %}
</head>


<body class="min-h-screen">


    <!-- SIDEBAR -->

    <aside
        class="sidebar fixed inset-y-0 left-0
               hidden lg:flex
               w-64
               p-6
               flex-col"
    >

        <!-- BRAND -->

        <a href="/" class="flex items-center gap-3">

            <div
                class="logo-box
                       w-12 h-12
                       rounded-xl
                       flex items-center justify-center
                       shrink-0"
            >
                <i class="ph-fill ph-fish-simple
                          text-2xl text-orange-600"></i>
            </div>

            <span class="text-2xl font-black">
                Selkie
            </span>

        </a>


        <!-- NAV -->

        <nav class="sidebar-nav mt-8 py-4">

            <a
                href="{{ url_for('dashboard.beacons') }}"
                class="sidebar-link
                       rounded-lg
                       px-3 py-2.5
                       flex items-center gap-3
                       font-bold
                       {% if request.endpoint in [
                           'dashboard.beacons',
                           'dashboard.beacon_details',
                           'dashboard.edit_beacon'
                       ] %}
                           active
                       {% endif %}"
            >
                <i class="ph-fill ph-broadcast text-xl"></i>

                <span>
                    Beacons
                </span>
            </a>

        </nav>


        <!-- LOGOUT -->

        <div class="mt-auto pt-5">

            <a
                href="/auth/logout"
                class="sidebar-link
                       rounded-lg
                       px-3 py-2.5
                       flex items-center gap-3
                       font-bold"
            >
                <i class="ph-bold ph-sign-out text-xl"></i>

                <span>
                    Logout
                </span>
            </a>

        </div>

    </aside>


    <!-- MOBILE HEADER -->

    <header
        class="lg:hidden
               px-5 pt-5"
    >

        <div
            class="retro-card rounded-xl
                   px-4 py-3
                   flex items-center justify-between"
        >

            <a href="/" class="flex items-center gap-3">

                <div
                    class="logo-box
                           w-11 h-11
                           rounded-lg
                           flex items-center justify-center"
                >
                    <i class="ph-fill ph-fish-simple
                              text-2xl text-orange-600"></i>
                </div>

                <span class="text-xl font-black">
                    Selkie
                </span>

            </a>

            <a
                href="{{ url_for('dashboard.beacons') }}"
                class="retro-btn
                       rounded-lg
                       p-2
                       flex items-center justify-center"
            >
                <i class="ph-fill ph-broadcast text-xl"></i>
            </a>

        </div>

    </header>


    <!-- MAIN -->

    <div class="lg:ml-64 min-h-screen">


        <!-- PAGE HEADER -->

        <header
            class="mx-5 mt-5 lg:mx-8 lg:mt-8
                   flex items-center justify-between
                   gap-4"
        >

            <div class="min-w-0">

                <h1 class="text-2xl sm:text-3xl font-black">
                    {% block navbar_title %}{% endblock %}
                </h1>

                {% block navbar_subtitle %}{% endblock %}

            </div>

            <div class="flex items-center gap-3 shrink-0">
                {% block navbar_actions %}{% endblock %}
            </div>

        </header>


        <!-- CONTENT -->

        <main class="px-3 pb-8 pt-6 ">

            {% block content %}{% endblock %}

        </main>

    </div>


    {% block scripts %}{% endblock %}

</body>
</html>
